[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pygooglehelper"
version = "0.0.9"
requires-python = ">=3.14"
authors = [
	{ name = "Mark Veltzer", email = "mark.veltzer@gmail.com" }
]
maintainers = [
	{ name = "Mark Veltzer", email = "mark.veltzer@gmail.com" }
]
description = "help you with the google API"
readme = "README.md"
license = "MIT"
keywords=[
    "api",
    "google",
    "python",
    "auth",
    "pagination",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "pytconf",
]

[dependency-groups]
dev = [
    "mypy",
    "pylint",
    "pytest",
    # pytconf 0.1.22 imports yaml but its published metadata does not
    # declare pyyaml (already fixed in the pytconf repo, unreleased);
    # drop this once pytconf 0.1.23 is on PyPI
    "pyyaml",
    "ruff",
]

[project.urls]
"Homepage" = "https://github.com/veltzer/pygooglehelper"
"Bug Tracker" = "https://github.com/veltzer/pygooglehelper/issues"
"Documentation" = "https://veltzer.github.io/pygooglehelper"
"Download" = "https://pypi.org/project/pygooglehelper/"
"Repository" = "https://github.com/veltzer/pygooglehelper"


[tool.ruff]
line-length = 130

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/pygooglehelper"]

[tool.hatch.build.targets.sdist]
include = [
    "src/pygooglehelper/",
    "README.md",
    "LICENSE",
    "pyproject.toml"
]
exclude = [
    ".gitignore",
    ".github/",
    "tests/",
    "docs/",
    "config/",
    "*.md",
]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
mypy_path = "src:python:scripts"
explicit_package_bases = true
namespace_packages = true

# Third-party libraries without type stubs; `foo.*` also matches `foo` itself.
[[tool.mypy.overrides]]
module = [
    "google.*",
    "google_auth_oauthlib.*",
    "pygooglehelper.*",
    "pytconf.*",
]
ignore_missing_imports = true
[tool.hatch.envs.default]
installer = "uv"

[tool.uv.pip]
prerelease = "disallow"
