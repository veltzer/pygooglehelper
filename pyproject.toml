[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pygooglehelper"
version = "0.0.9"
requires-python = ">=3.14"
authors = [
	{ name = "Mark Veltzer", email = "mark.veltzer@gmail.com" }
]
maintainers = [
	{ name = "Mark Veltzer", email = "mark.veltzer@gmail.com" }
]
description = "help you with the google API"
readme = "README.md"
license = "MIT"
keywords=[
    "api",
    "google",
    "python",
    "auth",
    "pagination",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "pytconf",
    "google-auth",
]

[dependency-groups]
dev = [
    "pyrefly",
    "pytest",
    "ruff",
    "sphinx",
]

[project.urls]
"Homepage" = "https://github.com/veltzer/pygooglehelper"
"Bug Tracker" = "https://github.com/veltzer/pygooglehelper/issues"
"Documentation" = "https://veltzer.github.io/pygooglehelper"
"Download" = "https://pypi.org/project/pygooglehelper/"
"Repository" = "https://github.com/veltzer/pygooglehelper"


[tool.ruff]
line-length = 130

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/pygooglehelper"]

[tool.hatch.build.targets.sdist]
include = [
    "src/pygooglehelper/",
    "README.md",
    "LICENSE",
    "pyproject.toml"
]
exclude = [
    ".gitignore",
    ".github/",
    "tests/",
    "docs/",
    "config/",
    "*.md",
]

[tool.pyrefly]
# Type checking (rsconstruct's pyrefly processor). preset = "legacy" is
# pyrefly's mypy-compatible behavior; "." on the search path is mypy's
# implicit current directory.
preset = "legacy"
python-version = "3.14"
search-path = [
    "src",
    ".",
]
# Third-party libraries without type information.
ignore-missing-imports = [
    "google.*",
    "google_auth_oauthlib.*",
    "pygooglehelper.*",
    "pytconf.*",
]

[tool.pyrefly.errors]
no-any-return = "error"

[tool.hatch.envs.default]
installer = "uv"

[tool.uv.pip]
prerelease = "disallow"
